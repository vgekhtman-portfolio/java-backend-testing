services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20

  wiremock:
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./sut/wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      # Host 8081 -> container 8080, so it doesn't collide with orders-service's own 8080.
      - "8081:8080"

  orders-service:
    build:
      context: .
      dockerfile: sut/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: orders
      PAYMENT_SERVICE_URL: http://wiremock:8080
    ports:
      - "8080:8080"
      - "9090:9090"
